name: Backend Python
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'data-pipeline/migrations/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main, dev-backend-rafael]
    paths:
      - 'backend/**'
      - 'data-pipeline/migrations/**'
      - '.github/workflows/backend-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: firesync_backend_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d firesync_backend_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - run: python -m pip check
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/firesync_backend_test
