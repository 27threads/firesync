# Produção na VPS: banco, API, job NRT e Cloudflare Tunnel. O front fica no Cloudflare (docs/deploy.md).
# Nenhum serviço publica porta: o único caminho de fora para dentro é o túnel até a API.
# Primeira vez: roteiro de carga do docs/banco.md (só o db). Depois, de infra/: docker compose up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: firesync
      POSTGRES_USER: firesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../data-pipeline/migrations:/docker-entrypoint-initdb.d:ro   # só no primeiro boot (docs/banco.md)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firesync -d firesync"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      # Usuário só de leitura, criado no roteiro de carga do docs/banco.md
      DATABASE_URL: postgresql://firesync_api:${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}@db:5432/firesync
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env}
      CLIENT_IP_HEADER: CF-Connecting-IP   # o túnel sobrescreve esse header; sem túnel, apague
      RISK_MAX_AGE_DAYS: ${RISK_MAX_AGE_DAYS:-2}   # notas de risco mais velhas que isso somem do mapa
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  job-nrt:
    build: ../data-pipeline
    environment:
      DATABASE_URL: postgresql://firesync:${POSTGRES_PASSWORD}@db:5432/firesync
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:?set FIRMS_MAP_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Risco dos 14 dias por célula (docs/rfcs/0003-modelo-risco.md): treina, pontua e grava em risco_celulas
  # uma vez por dia. Mesma imagem do job-nrt. As faixas vêm do config/risk_rules.json, montado só para leitura.
  job-risco:
    build: ../data-pipeline
    command: ["sh", "-c", "while true; do python risco_celulas.py --gravar --regras /config/risk_rules.json || true; sleep 86400; done"]
    environment:
      DATABASE_URL: postgresql://firesync:${POSTGRES_PASSWORD}@db:5432/firesync
    volumes:
      - ../config/risk_rules.json:/config/risk_rules.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
