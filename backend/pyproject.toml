[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firesync-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["h3>=4.2,<5", "shapely>=2,<3", "pyproj>=3.7,<4", "psycopg[binary,pool]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.32,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.28,<1", "pandas>=2.2,<3"]

[tool.setuptools]
package-dir = {backend = "src"}
packages = [
  "backend", "backend.domain", "backend.domain.models", "backend.domain.calculations",
  "backend.application", "backend.ports", "backend.adapters", "backend.adapters.inbound",
  "backend.adapters.inbound.http", "backend.adapters.outbound", "backend.adapters.outbound.postgres",
  "backend.adapters.outbound.config_file", "backend.adapters.outbound.llm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["integration: requires a disposable PostGIS database"]
