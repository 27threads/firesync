[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firesync-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["h3>=4.2,<5", "shapely>=2,<3", "pyproj>=3.7,<4", "psycopg[binary,pool]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["integration: requires a disposable PostGIS database"]
